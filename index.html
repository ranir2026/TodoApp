<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <!-- Opened from the Home Screen, the app gets a window of its own rather than a browser tab, which
         src/HomeScreenGate.jsx turns away on an iPhone. Older iPhones read the meta tag instead of the manifest. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Todo" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" />
    <!-- The splash: shown from the first paint, before any script loads. src/LoadingScreen.jsx draws
         the same thing once React is running, so keep the two alike. -->
    <style>
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; margin: 0; background: #f8fafc; font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      /* A plain spinner: an arc going round a faint ring */
      .boot-spinner { width: 32px; height: 32px; fill: none; stroke: #0071e3; stroke-width: 2.5; stroke-linecap: round; animation: boot-spin 0.8s linear infinite; }
      .boot-spinner circle { stroke-opacity: 0.18; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      .boot-label { margin: 0; font-size: 13px; font-weight: 500; letter-spacing: 0.01em; color: #64748b; animation: boot-label-in 300ms ease-out 600ms both; }
      @keyframes boot-label-in { from { opacity: 0; } to { opacity: 1; } }
      /* Slower, but never still: a stopped spinner would look stuck */
      @media (prefers-reduced-motion: reduce) {
        .boot-spinner { animation-duration: 1.6s; }
      }
    </style>
    <title>Todo</title>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status">
        <svg class="boot-spinner" viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="10" cy="10" r="7.5" />
          <path d="M17.5 10A7.5 7.5 0 0 0 10 2.5" />
        </svg>
        <p class="boot-label">Loading…</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
