         the same thing once React is running, so keep the two alike. -->
    <style>.boot{-webkit-font-smoothing:antialiased;background:#f8fafc;flex-direction:column;justify-content:center;align-items:center;gap:16px;margin:0;font-family:Inter,system-ui,sans-serif;display:flex;position:fixed;inset:0}.boot-spinner{fill:none;stroke:#0071e3;stroke-width:2.5px;stroke-linecap:round;width:32px;height:32px;animation:.8s linear infinite boot-spin}.boot-spinner circle{stroke-opacity:.18}@keyframes boot-spin{to{transform:rotate(360deg)}}.boot-label{letter-spacing:.01em;color:#64748b;margin:0;font-size:13px;font-weight:500;animation:.3s ease-out .6s both boot-label-in}@keyframes boot-label-in{0%{opacity:0}to{opacity:1}}@media (prefers-reduced-motion:reduce){.boot-spinner{animation-duration:1.6s}}</style>
