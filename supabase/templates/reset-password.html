<!-- Supabase: Authentication, Emails, Templates, "Reset password".
     Subject: Choose a new password for Todo -->
<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#f5f6f8;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f6f8;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#ffffff;border-radius:16px;border:1px solid #e5e8ee;">
            <tr>
              <td style="padding:32px 32px 28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#172033;">
                <p style="margin:0 0 24px;font-size:17px;font-weight:600;">Todo</p>
                <h1 style="margin:0 0 8px;font-size:20px;font-weight:600;line-height:1.3;">Choose a new password</h1>
                <p style="margin:0 0 24px;font-size:15px;line-height:1.5;color:#4a5568;">
                  Someone asked to reset the password for the Todo account {{ .Email }}. Open the link to choose a new one.
                </p>
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#0071e3;color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;padding:12px 22px;border-radius:12px;">Choose a new password</a>
                <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#7a8494;">
                  The link works once and expires after an hour. If you didn't ask for this, ignore this email. Your password stays the same.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
